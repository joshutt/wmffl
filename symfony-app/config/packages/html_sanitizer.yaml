framework:
    html_sanitizer:
        sanitizers:
            # Sanitizer for member/admin-authored article HTML. Allows the
            # standard safe formatting elements (paragraphs, links, images,
            # headings, lists, emphasis, tables) while stripping <script>,
            # inline event handlers and javascript:/data: URLs. Relative URLs
            # are kept because article images are served from relative paths
            # like img/l/{hash}.
            app.article:
                allow_safe_elements: true
                allow_static_elements: true
                allow_relative_links: true
                allow_relative_medias: true
                # Symfony's HtmlSanitizer defaults max_input_length to 20,000
                # bytes, silently truncating anything longer at sanitize()
                # time. articles.articleText is MEDIUMTEXT (16MB, see
                # Version20260826000000), so match that ceiling instead.
                max_input_length: 16_777_215
